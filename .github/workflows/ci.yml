name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml に固定したバージョンの zola / pagefind_extended / wrangler を入れる
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Build
        run: scripts/build.sh

      - name: Check site structure
        run: python3 scripts/check.py

      - name: Check internal links
        run: zola check --skip-external-links

      # Cloudflare の準備ができたら、リポジトリの変数 DEPLOY_ENABLED を true にし、
      # シークレット CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録する
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
